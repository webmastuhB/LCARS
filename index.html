<!DOCTYPE html>
<html>

<head>
    <title>NCC-73191 USS Toronto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <link rel="stylesheet" type="text/css" href="css/classic-26101a.css">

    <link rel="stylesheet" type="text/css"  href="css/site.css"/>
    <link rel="icon" type="image/png" href="https://d700mbxo45lbr.cloudfront.net/lcars/thelcarsicon.png">
</head>

<body>
    <section class="wrap-standard" id="column-3">
        <div class="wrap">
            <div class="left-frame-top">
                <button onclick="playSoundAndRedirect('audio2', '#')" class="panel-1"><span class="hop">The</span>LCARS<span class="hop">.com</span></button>
                <button href="#" onclick="ToggleSound();" class="panel-2"><img id="SoundIcon" src="img/SoundOnIcon.png" class="SoundIcon"/></button>
            </div>
            <div class="right-frame-top">
                <div class="TopMainBlock">
                    <div id="TopMainBlockLeft" style="padding-top: 40px;padding-right: 30px;">
                        <img src="img/USSTorontoNoNotes.png" />
                        <div class="CheyenneStats">
                            <div>LENGTH: 362 M</div>
                            <div>BEAM: 249.8 M</div>
                            <div>HEIGHT: 89.5 M</div>
                            <div class="ButterscotchColor">MASS: 1,047,000 M.T.</div>
                        </div>
                    </div>
                    <div id="TopMainBlockRight">
                        <div class="banner "><div class="BlueyColor">NCC-73191</div><div class="ButterscotchColor">&nbsp;&nbsp;USS Toronto</div></div>
                        <nav>
                            <button onclick="playSoundAndRedirect('audio2', '#')" class="nav-1">01-ship</button>
                            <button onclick="playSoundAndRedirect('audio2', '#')" class="nav-3">03-crew</button>
                        </nav>
                    </div>
                </div>
                <div class="bar-panel first-bar-panel">
                    <div class="bar-1"></div>
                    <div class="bar-2"></div>
                    <div class="bar-3"></div>
                    <div class="bar-4"></div>
                    <div class="bar-5"></div>
                </div>
            </div>
        </div>
        <div class="wrap" id="gap">
            <div class="left-frame">
                <button onclick="topFunction(); playSound()" id="topBtn"><span class="hop">screen</span> top</button>
                <div>
                    <button onclick="playSoundAndRedirect('audio2', '#')" class="panel-3">03<span class="hop">-111968</span></button>
                    <button onclick="playSoundAndRedirect('audio2', '#')" class="panel-4">04<span class="hop">-041969</span></button>
                    <button onclick="playSoundAndRedirect('audio2', '#')" class="panel-5">05<span class="hop">-1701D</span></button>
                    <button onclick="playSoundAndRedirect('audio2', '#')" class="panel-6">06<span class="hop">-071984</span></button>
                    <div class="panel-spacer"></div>
                </div>
                <div>
                    <button onclick="playSoundAndRedirect('audio2', '')" class="panel-7">07<span class="hop">-081940</span></button>
                </div>
            </div>
            <div class="right-frame">
                <div class="bar-panel">
                    <div class="bar-6"></div>
                    <div class="bar-7"></div>
                    <div class="bar-8"></div>
                    <div class="bar-9"></div>
                    <div class="bar-10"></div>
                </div>
                <main>

<div id="TNGSliderMomentum2"></div>

<div id="TNGSliderWarpDrive"></div>


<div id="TNGSlider_template" style="display: none;">
    <div class="TNGSlider">
        <div id="TNGSlider_{{TNGSliderName}}" class="TNGSlider_Top">
            <button id="TNGSlider_{{TNGSliderName}}_Minus" class="TNGSlider_ButtonPlusMinus TNGSlider_Minus" onclick="UpdateTNGSlider(TNGSliderDataName, 'minus');">-</button>
            <div id="TNGSlider_{{TNGSliderName}}_InnerBlock" class="TNGSlider_InnerBlock">
                {{TNGSliderUnits}}
            </div>
            <button id="TNGSlider_{{TNGSliderName}}_Plus" class="TNGSlider_ButtonPlusMinus TNGSlider_Plus" onclick="UpdateTNGSlider(TNGSliderDataName, 'plus')">+</button>
        </div>
        <div class="TNGSlider_Bottom">
            <span id="TNGSlider_{{TNGSliderName}}_DisplayName">{{TNGSliderDisplayName}}:</span> <span id="TNGSlider_{{TNGSliderName}}_Value" class="TNGSlider_Value">0</span>
        </div>
    </div>
    {{TNGSliderStyles}}
</div>


<script>
    let momentumSlider2 = {
        name: "MomentumSlider2",
        min: 0, 
        max: 6,
        currentValue: 0,
        displayName: "Momentum",
        unitLitColor: "#cdd4ff"
    };

    let warpDriveSlider = {
        name: "WarpDriveSlider",
        min: 0, 
        max: 9,
        currentValue: 0,
        displayName: "Warp Drive",
        width: "500px",
        unitBorderColor: "pink",
        unitAllBorderColor: "#ACACAC",
        unitLitColor: "red",
        plusColor: "green",
        minusColor: "orange",
        displayNameColor: "purple",
        valueColor: "red"
    };
</script>

            </div>

<script type="text/javascript" src="js/lcars.js"></script>

<script>
    //////////////////////////////////////////////////////////////////////////////////
    //
    // global sound on off stuff for this page
    //
    let g_soundOn = true;

    function ToggleSound() {
        if (g_soundOn === true) {
            g_soundOn = false;
            document.getElementById('SoundIcon').src = 'img/SoundOffIcon.png';
        } else {
            g_soundOn = true;
            document.getElementById('SoundIcon').src = 'img/SoundOnIcon.png';
            playSound('audio2');
        }
        console.log("soundOn=" + g_soundOn);
    }
    //
    // end global sound on off stuff
    //
    //////////////////////////////////////////////////////////////////////////////////
</script>

<script src="TNGSlider/TNGSlider.js"></script>

</body>
